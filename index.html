<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento OV — Oliveira &amp; Vasconcelos</title>
<meta name="description" content="Atendimento inicial do escritório Oliveira &amp; Vasconcelos — Advocacia e Consultoria Jurídica, Manaus/AM.">
<meta property="og:title" content="Atendimento OV — Oliveira &amp; Vasconcelos">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--grafite:#202b38;--grafite2:#2b3746;--champanhe:#c9ad84;--champanhe-esc:#9c7f57;--creme:#f6f1e8;--texto:#26313d;--suave:#5f6b78;--borda:#ddd6ca}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);line-height:1.5;-webkit-text-size-adjust:100%}
.shell{max-width:640px;margin:24px auto 48px;background:#fff;border-radius:20px;box-shadow:0 10px 40px #20283214;overflow:hidden}
.brand{background:#1e1e1e;text-align:center;padding:26px 16px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand img{width:88%;max-width:380px;height:auto;display:block;margin:0 auto}
.brand .tit{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;color:var(--champanhe);font-size:11.5px;letter-spacing:.16em;font-weight:600;margin-top:8px;text-transform:uppercase}
.brand .tit .sep{width:1px;height:14px;background:var(--champanhe);opacity:.6}
.brand .tit .modo{color:#e9dcc6;font-weight:500}
.wrap{padding:22px 22px 8px}
.progress{margin:0 0 18px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--suave)}
.track{height:6px;border-radius:9px;background:#ece7de;margin-top:8px}
.track>div{height:6px;border-radius:9px;background:var(--champanhe-esc);transition:width .25s}
h2{font-size:22px;margin:4px 0 6px;color:var(--grafite)}
p{color:var(--suave);margin:6px 0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;margin:22px 0 10px;color:var(--champanhe-esc);font-weight:700}
.area{display:block;width:100%;text-align:left;border:1px solid var(--borda);border-radius:12px;background:#fff;padding:13px 15px;margin-bottom:9px;color:inherit;cursor:pointer;font:inherit}
.area strong{display:block;font-size:15px;color:var(--grafite)}
.area small{display:block;color:var(--suave);margin-top:2px;font-size:13px}
.area .excl{display:inline-block;margin-top:7px;background:#f3ead9;color:#7a5f36;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:600}
.sub{font-size:13px;margin:-6px 0 10px;color:var(--suave)}
.cal{border:1px solid var(--borda);border-radius:14px;padding:12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--grafite)}
.cal-top .nav{width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:11.5px;color:var(--suave);font-weight:600;padding:4px 0}
.cal-grid .dia{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;padding:0;border:1px solid transparent}
.cal-grid button.dia{background:#f3ead9;color:var(--grafite);font-weight:600;border-color:#e6d6b8}
.cal-grid button.dia.sel{background:var(--champanhe-esc);color:#fff;border-color:var(--champanhe-esc)}
.cal-grid .dia.off{color:#c3c7cc}
.cal-leg{font-size:12px;margin:8px 0 0}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.hora{padding:10px 0;font-weight:600;border-radius:10px}
.hora.sel{background:var(--champanhe-esc);color:#fff;border-color:var(--champanhe-esc)}
.anexar{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--champanhe-esc);border-radius:12px;padding:14px;color:var(--champanhe-esc);font-weight:600;cursor:pointer;background:#fbf8f2}
.anexar input{display:none}
.anexar.dis{opacity:.5;cursor:not-allowed}
.anexos{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.anexos li{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--borda);border-radius:10px;padding:8px 10px;font-size:13.5px;word-break:break-all}
.anexos small{color:var(--suave)}
.anexos .rm{padding:4px 10px;border-radius:8px;flex:none}
.obs{font-size:12.5px;background:#f6f0e3;color:#5b4a2f;border-radius:10px;padding:9px 12px;margin:2px 0 4px}
.area.sel,.opt.sel{border:2px solid var(--champanhe-esc);background:#fbf8f2;padding:12px 14px}
.field{margin:18px 0}
.field>label,.qlabel{display:block;font-weight:650;margin-bottom:8px;color:var(--grafite)}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;border-radius:10px;border:1px solid #cfd3d8;padding:12px;font:inherit;font-size:16px;color:var(--texto);background:#fff}
input:focus,textarea:focus{outline:2px solid var(--champanhe);border-color:transparent}
.group{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--borda);border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #b9b2a6}
.opt.sel .dot{border:5px solid var(--champanhe-esc)}
.actions{display:flex;gap:10px;margin-top:22px}
.actions>*{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #cfd3d8;padding:13px 16px;background:#fff;color:var(--grafite)}
button.primary{background:var(--grafite);color:#fff;border-color:var(--grafite);font-weight:600}
button.gold{background:var(--champanhe-esc);border-color:var(--champanhe-esc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.full{width:100%;margin-top:14px}
.box{background:#f7f4ee;border-radius:12px;padding:16px;margin:18px 0}
.box h3{margin:0 0 6px;font-size:17px;color:var(--grafite)}
.privacy p,.privacy li{font-size:13px}
.privacy details summary{cursor:pointer;font-size:13px;color:var(--champanhe-esc);font-weight:600;margin-top:6px}
.privacy ul{padding-left:18px;margin:6px 0}
.consent{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;margin-top:10px;cursor:pointer}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--champanhe-esc);flex:none}
.review{border:1px solid var(--borda);border-radius:12px;padding:16px;margin-top:16px}
.review dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.review dt{color:var(--suave)}
.review dd{margin:0;font-weight:600}
.price{font-size:28px;font-weight:700;color:var(--grafite);margin:10px 0 0}
.notice{font-size:14px;padding:12px;background:#f6f0e3;border-radius:10px;color:#5b4a2f}
.error{color:#a52d2d;font-size:14px}
.protocol{font-size:12px;color:var(--suave);margin-top:14px}
.wa{display:block;text-align:center;text-decoration:none;background:#1f8f4e;color:#fff;border-radius:10px;padding:13px;font-weight:600;margin-top:12px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer{border-top:1px solid #eee;margin:24px 22px 0;padding:16px 0 22px;text-align:center;color:#7a838d;font-size:12px}
@media(max-width:560px){.brand .tit{flex-direction:column;gap:2px}.brand .tit .sep{display:none}}
@media(max-width:680px){.shell{margin:0;border-radius:0;min-height:100vh;box-shadow:none}.wrap{padding:18px 16px 6px}footer{margin:20px 16px 0}}
</style>
</head>

(function(){

var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function diasLivres(){var m={};S.slots.forEach(function(s){(m[s.dia]=m[s.dia]||[]).push(s);});return m;}
function ym(d){return d.slice(0,7);}
function calendario(){
  var livres=diasLivres(), dias=Object.keys(livres).sort();
  var primeiro=ym(dias[0]), ultimo=ym(dias[dias.length-1]);
  if(!S.mes||S.mes<primeiro||S.mes>ultimo)S.mes=S.dia?ym(S.dia):primeiro;
  var y=+S.mes.slice(0,4), mo=+S.mes.slice(5,7)-1;
  var h='<div class="field"><span class="qlabel">Escolha o dia da consulta</span><div class="cal">';
  h+='<div class="cal-top"><button type="button" class="nav" id="mesAnt" '+(S.mes<=primeiro?'disabled':'')+' aria-label="Mês anterior">‹</button>'+
     '<strong>'+MESES[mo]+' de '+y+'</strong>'+
     '<button type="button" class="nav" id="mesProx" '+(S.mes>=ultimo?'disabled':'')+' aria-label="Próximo mês">›</button></div>';
  h+='<div class="cal-grid">';
  ['D','S','T','Q','Q','S','S'].forEach(function(d){h+='<span class="dow">'+d+'</span>';});
  var ini=new Date(y,mo,1).getDay(), n=new Date(y,mo+1,0).getDate();
  for(var i=0;i<ini;i++)h+='<span></span>';
  for(var d=1;d<=n;d++){
    var k=S.mes+'-'+(d<10?'0':'')+d, ok=!!livres[k];
    h+=ok?'<button type="button" class="dia'+(S.dia===k?' sel':'')+'" data-dia="'+k+'">'+d+'</button>':'<span class="dia off">'+d+'</span>';
  }
  h+='</div><p class="cal-leg">Dias em destaque têm horários livres. Agenda disponível para os próximos 3 meses.</p></div></div>';
  if(S.dia&&livres[S.dia]){
    var dd=S.dia.split('-');
    h+='<div class="field" id="horas"><span class="qlabel">Horários em '+dd[2]+'/'+dd[1]+' — horário de Manaus</span><div class="horas">';
    livres[S.dia].forEach(function(s){h+='<button type="button" class="hora'+(S.chosen&&S.chosen.start===s.start?' sel':'')+'" data-slot="'+esc(s.start)+'">'+esc(s.hora)+'</button>';});
    h+='</div></div>';
  }
  return h;
}

  document.querySelectorAll('[data-slot]').forEach(function(b){b.onclick=function(){var st=b.getAttribute('data-slot');S.chosen=S.slots.filter(function(s){return s.start===st;})[0];S.error='';render();
    var md=document.getElementById('modos');if(md)md.scrollIntoView({behavior:'smooth',block:'center'});};});
  document.querySelectorAll('[data-dia]').forEach(function(b){b.onclick=function(){S.dia=b.getAttribute('data-dia');S.chosen=null;S.modo='';S.error='';render();
    var hr=document.getElementById('horas');if(hr)hr.scrollIntoView({behavior:'smooth',block:'center'});};});
  if($('mesAnt'))$('mesAnt').onclick=function(){var y=+S.mes.slice(0,4),m=+S.mes.slice(5,7)-1;var d=new Date(y,m-1,1);S.mes=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render();};
  if($('mesProx'))$('mesProx').onclick=function(){var y=+S.mes.slice(0,4),m=+S.mes.slice(5,7)-1;var d=new Date(y,m+1,1);S.mes=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render();};
  document.querySelectorAll('[data-modo]').forEach(function(b){b.onclick=function(){S.modo=b.getAttribute('data-modo');S.error='';render();
    var rv=document.querySelector('.review');if(rv)rv.scrollIntoView({behavior:'smooth',block:'center'});};});
  if($('nome'))$('nome').oninput=function(e){S.name=e.target.value;atualizarBotao();};
  if($('fone'))$('fone').oninput=function(e){S.phone=e.target.value;atualizarBotao();};
  if($('email'))$('email').oninput=function(e){S.email=e.target.value;};
  if($('ov_hp_x9'))$('ov_hp_x9').oninput=function(e){S.website=e.target.value;};
  if($('arquivos'))$('arquivos').onchange=function(e){anexar(e.target.files);};
  document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){S.anexos.splice(+b.getAttribute('data-rm'),1);S.anexoErro='';var y=window.scrollY;render();window.scrollTo(0,y);};});
  if($('relato'))$('relato').oninput=function(e){S.narrative=e.target.value;atualizarBotao();};
  if($('consent'))$('consent').onchange=function(e){S.consent=e.target.checked;render();};
  if($('voltar'))$('voltar').onclick=function(){ir(Math.max(0,S.step-1));};
  if($('seguir'))$('seguir').onclick=function(){ir(S.step+1);};
  if($('enviar'))$('enviar').onclick=enviar;
  if($('confirmar'))$('confirmar').onclick=confirmar;
  if($('novo'))$('novo').onclick=function(){S={step:0,area:null,subject:'',name:'',phone:'',email:'',answers:{},narrative:'',consent:false,busy:false,error:'',result:null,slots:null,agendaMsg:'',chosen:null,modo:'',dia:'',mes:'',anexos:[],lendo:false,anexoErro:'',booked:null,website:''};render();topo();};
}

// Atualiza só o estado do botão (sem redesenhar e perder o foco do campo)
function atualizarBotao(){
  var a=areaSel();
  if(S.step===1){var ok=S.name.trim().length>=2&&fone().length>=10&&fone().length<=13;document.getElementById('seguir').disabled=!ok;}
  if(S.step===3){var pode=!S.busy&&!S.lendo&&S.consent&&(a.featured||S.narrative.trim())&&faltando().length===0;document.getElementById('enviar').disabled=!pode;}
}

// ---------- Anexos (documentos, imagens e prints) ----------
var MAX_ANEXOS=5, MAX_MB=5;
function blocoAnexos(){
  var h='<div class="field"><span class="qlabel">Anexar documentos, imagens ou prints <span style="font-weight:400;color:var(--suave)">(opcional)</span></span>';
  h+='<label class="anexar'+(S.anexos.length>=MAX_ANEXOS||S.lendo?' dis':'')+'"><input type="file" id="arquivos" multiple accept="image/*,application/pdf" '+(S.anexos.length>=MAX_ANEXOS||S.lendo?'disabled':'')+'>'+
     (S.lendo?'<span class="spinner" style="border-color:#c9ad8466;border-top-color:#9c7f57"></span>Preparando arquivos...':'📎 Toque para anexar')+'</label>';
  h+='<p class="cal-leg">Até '+MAX_ANEXOS+' arquivos (fotos, prints ou PDF, até '+MAX_MB+' MB cada). Não envie senhas nem fotos de cartão.</p>';
  if(S.anexos.length){h+='<ul class="anexos">';S.anexos.forEach(function(f,i){h+='<li><span>'+(f.type==='application/pdf'?'📄':'🖼️')+' '+esc(f.name)+' <small>('+Math.max(1,Math.round(f.bytes/1024))+' KB)</small></span><button type="button" class="rm" data-rm="'+i+'" aria-label="Remover">✕</button></li>';});h+='</ul>';}
  if(S.anexoErro)h+='<p class="error">'+esc(S.anexoErro)+'</p>';
  return h+'</div>';
}
function lerArquivo(f){return new Promise(function(ok,no){
  var r=new FileReader();
  if(/^image\//.test(f.type)&&f.type!=='image/gif'){
    r.onload=function(){var img=new Image();img.onload=function(){
      var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);var url=c.toDataURL('image/jpeg',0.82);
      ok({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:url.split(',')[1],bytes:Math.round(url.length*0.75)});};
      img.onerror=function(){f.size>MAX_MB*1048576?no(f.name+': arquivo maior que '+MAX_MB+' MB.'):ok({name:f.name,type:f.type||'image/jpeg',data:r.result.split(',')[1],bytes:f.size});};
      img.src=r.result;};
  } else {
    if(f.type!=='application/pdf'&&!/^image\//.test(f.type))return no(f.name+': envie apenas imagens ou PDF.');
    if(f.size>MAX_MB*1048576)return no(f.name+': arquivo maior que '+MAX_MB+' MB.');
    r.onload=function(){ok({name:f.name,type:f.type,data:r.result.split(',')[1],bytes:f.size});};
  }
  r.onerror=function(){no(f.name+': não foi possível ler o arquivo.');};
  r.readAsDataURL(f);
});}
function anexar(lista){
  var arr=Array.prototype.slice.call(lista,0,MAX_ANEXOS-S.anexos.length);
  if(!arr.length)return;S.lendo=true;S.anexoErro='';render();
  var erros=[];
  arr.reduce(function(pr,f){return pr.then(function(){return lerArquivo(f).then(function(x){S.anexos.push(x);},function(e){erros.push(e);});});},Promise.resolve())
  .then(function(){S.lendo=false;S.anexoErro=erros.join(' ');if(lista.length>arr.length)S.anexoErro+=(S.anexoErro?' ':'')+'Limite de '+MAX_ANEXOS+' arquivos.';var y=window.scrollY;render();window.scrollTo(0,y);});
}

function enviar(){
  S.busy=true;S.error='';render();
  google.script.run.withSuccessHandler(function(r){
    S.busy=false;S.result=r;S.step=4;render();topo();
    if(r.status!=='analise_escritorio'&&r.protocolo)carregarHorarios();
  }).withFailureHandler(function(e){S.busy=false;S.error=(e&&e.message)||'Não foi possível enviar. Tente novamente.';render();})
  .registrarAtendimento({area:S.area,subject:S.subject,name:S.name,phone:S.phone,email:S.email.trim(),answers:S.answers,narrative:S.narrative,consent:S.consent,website:S.website,
    anexos:S.anexos.map(function(f){return {name:f.name,type:f.type,data:f.data};})});
}
function carregarHorarios(){
  S.slots=null;render();
  google.script.run.withSuccessHandler(function(j){S.slots=j.slots||[];S.agendaMsg=j.available?'':(j.message||'');render();})
  .withFailureHandler(function(){S.slots=[];S.agendaMsg='Agenda indisponível no momento';render();})
  .listarHorarios(S.result.protocolo,S.result.token);
}
function confirmar(){
  if(!S.chosen||!S.modo)return;S.busy=true;S.error='';render();
  google.script.run.withSuccessHandler(function(b){S.busy=false;S.booked=b;render();topo();})
  .withFailureHandler(function(e){S.busy=false;S.error=(e&&e.message)||'Não foi possível agendar.';S.chosen=null;carregarHorarios();})
  .agendar(S.result.protocolo,S.result.token,S.chosen.start,S.modo);
}

document.getElementById('rodape').innerHTML='© '+D.ano+' '+esc(D.escritorio)+' · Manaus/AM<br><small>O preenchimento do formulário não constitui contratação de serviços advocatícios nem garante resultado.</small>';
render();
